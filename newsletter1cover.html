<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Newsletter</title>

    <link rel="stylesheet" href="stylecover.css">

</head>

<body>

    <div class="catalog-app">

        <div id="viewer">

            <div id="flipbook" class="ui-flipbook">

                <!-- NEXT / PREVIOUS ARROWS -->
                <a ignore="1"
                   class="ui-arrow-control ui-arrow-next-page">
                    <i class="fas fa-chevron-right"></i>
                </a>

                <a ignore="1"
                   class="ui-arrow-control ui-arrow-previous-page">
                    <i class="fas fa-chevron-left"></i>
                </a>


                <!-- PAGE 1 : FRONT COVER -->
                <div class="page1"></div>

                <!-- PAGE 2 : INSIDE LEFT -->
                <div class="page2"></div>

                <!-- PAGE 3 : INSIDE RIGHT -->
                <div class="page3"></div>

                <!-- PAGE 4 : SECOND SPREAD LEFT -->
                <div class="page4"></div>

                <!-- PAGE 5 : SECOND SPREAD RIGHT -->
                <div class="page5"></div>

                <!-- PAGE 6 : SPINE -->
                <div class="page6"></div>

                <!-- PAGE 7 : BACK COVER -->
                <div class="page7"></div>

            </div>

        </div>

    </div>


    <!-- Turn.js -->
    <script src="turn.js"></script>

    <!-- Your flipbook JS -->
    <script src="newsletter1cover.js"></script>

</body>

</html>
