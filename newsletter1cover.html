<!DOCTYPE html>
<html lang="en">
<head>

  <title>Flipping Book</title>
  <link rel="stylesheet" href="stylecover.css">
  
  <!-- Required Dependencies -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Assuming your provided script is saved as turn.js -->
  <script src="turn.js"></script> 
</head>
<body>

  <div id="flipbook">

    <div class="hard" style="background-image:url(front.jpg)"></div>

    <div style="background-image:url(page1.jpg)"></div>

    <div style="background-image:url(page4.jpg)"></div>

    <div class="hard" style="background-image:url(back.jpg)"></div>
  </div>

  <script src="newsletter1cover.js"></script>
